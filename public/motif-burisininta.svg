        fill="#E8184A"/>
  <!-- Selimut kuning dalam kanan -->
  <path d="M50,22 C56,18 66,17 67,26 C68,33 60,36 53,32"
        fill="#F5C200"/>
  <!-- Ekor hitam kanan -->
  <path d="M68,30 C76,36 74,48 64,44 C58,42 56,34 60,30"
        fill="#1a1a1a"/>
