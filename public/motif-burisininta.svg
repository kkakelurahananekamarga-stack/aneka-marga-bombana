  <!-- Batang vertikal ungu/biru di tengah, daun spiral merah-kuning-hitam kiri-kanan -->

  <!-- Batang tengah -->
  <line x1="50" y1="0" x2="50" y2="200" stroke="#3730a3" stroke-width="4"/>

  <!-- === PASANG DAUN 1 === -->
