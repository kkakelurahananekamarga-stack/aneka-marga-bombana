        fill="#E8184A"/>
  <path d="M50,22 C44,18 34,17 33,26 C32,33 40,36 47,32"
        fill="#F5C200"/>
  <path d="M32,30 C24,36 26,48 36,44 C42,42 44,34 40,30"
        fill="#1a1a1a"/>

